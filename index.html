<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resep Spesial Buat Kamu 💊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f2e6;--ink:#12383a;--pink:#ff5c8a;--sun:#ffd23f;--paper:#fffef9;--teal:#1f9d8b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
 padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 84px);
 background-image:radial-gradient(circle at 20% 15%,#fff8 0 60px,transparent 61px),radial-gradient(circle at 85% 80%,#fff6 0 90px,transparent 91px)}
h1,h2,.btn{font-family:'Baloo 2',system-ui,sans-serif}
.screen{display:none;width:100%;max-width:440px;text-align:center}
.screen.on{display:block}
h1{font-size:clamp(30px,8vw,40px);line-height:1.05;font-weight:800;margin-bottom:10px}
.sub{font-size:17px;margin-bottom:34px}

/* Tombol kapsul: tahan sampai penuh */
#capWrap{position:relative;width:250px;height:110px;margin:0 auto 18px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.half{position:absolute;top:0;width:125px;height:110px;transition:transform .6s cubic-bezier(.2,1.4,.4,1)}
.half.l{left:0;background:var(--pink);border-radius:55px 0 0 55px;border:4px solid var(--ink);border-right-width:2px}
.half.r{right:0;background:var(--paper);border-radius:0 55px 55px 0;border:4px solid var(--ink);border-left-width:2px;overflow:hidden}
.fill{position:absolute;left:0;bottom:0;height:0;width:100%;background:var(--sun);transition:height .05s linear}
.half.l::after{content:"";position:absolute;left:18px;top:14px;width:14px;height:50px;border-radius:8px;background:#fff7;transform:rotate(8deg)}
.cap-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 17px 'Baloo 2',sans-serif;z-index:3;pointer-events:none;text-shadow:0 2px 0 #fff}
#capWrap.open .l{transform:translate(-120px,-40px) rotate(-35deg)}
#capWrap.open .r{transform:translate(120px,-40px) rotate(35deg)}
#capWrap.open .cap-label{opacity:0}
#capWrap:active{transform:scale(.97)}
.hint{font-size:14px;opacity:.75;min-height:20px}
.pct{font:800 22px 'Baloo 2';margin-top:6px;min-height:34px}

/* Kartu */
.card{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:26px 22px;text-align:left;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.card h2{font-size:25px;margin-bottom:10px;line-height:1.1}
.card p{font-size:17.5px;line-height:1.6;min-height:96px}
.card.core{background:#fff1f5}
.card.core p{font-size:17px}
.card.core .sign{font:800 28px 'Baloo 2';color:var(--pink);margin-top:10px}
@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.btn{margin-top:26px;background:var(--sun);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:10px 28px;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.fx button:focus-visible,#capWrap:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.dots{margin-top:18px;font-size:13px;opacity:.7}

/* Bar efek */
.fx{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom,0) + 10px);background:var(--paper);border-top:4px solid var(--ink);z-index:20}
.fx button{width:52px;height:52px;font-size:24px;border-radius:16px;border:3px solid var(--ink);background:var(--bg);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.fx button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.fx button.on{background:var(--sun)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:15}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(8px,-3px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(5px,-2px)}}
.float{position:fixed;font-size:34px;z-index:16;pointer-events:none;animation:up 2.4s ease-out forwards}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- LAYAR 1: tombol kapsul -->
<section class="screen on" id="s0">
  <h1>🚨 Ada resep darurat<br>buat <span id="nm"></span>!</h1>
  <p class="sub">Dokter gadungan sudah menyiapkan obatnya.</p>
  <div id="capWrap" role="button" tabindex="0" aria-label="Tahan kapsul sampai penuh untuk membuka pesan">
    <div class="half l"></div>
    <div class="half r"><div class="fill" id="fill"></div></div>
    <div class="cap-label">TAHAN AKU</div>
  </div>
  <div class="pct" id="pct">💊</div>
  <p class="hint" id="hint">Tahan kapsulnya sampai penuh, jangan dilepas!</p>
</section>

<!-- LAYAR 2: kartu-kartu -->
<section class="screen" id="s1">
  <div class="card" id="card"><h2 id="ct"></h2><p id="cp"></p></div>
  <button class="btn" id="next">Lanjut</button>
  <div class="dots" id="dots"></div>
</section>

<canvas id="cv"></canvas>

<div class="fx" aria-label="Tombol efek">
  <button id="bHorn" title="Terompet">📯</button>
  <button id="bDrum" title="Drum">🥁</button>
  <button id="bPiano" title="Piano">🎹</button>
  <button id="bSneeze" title="Bersin">🤧</button>
  <button id="bBoing" title="Boing">🪀</button>
  <button id="bConf" title="Konfeti">🎉</button>
  <button id="bMusic" title="Musik latar">🎵</button>
</div>

<script>
/* ====== UBAH DI SINI ====== */
const NAMA_DIA = "Sayang";      // nama panggilan dia
const NAMA_KAMU = "";            // isi namamu kalau mau ditulis di akhir, kosongkan kalau tidak

const CARDS = [
  {t:"🩺 Pemeriksaan dimulai", p:"Dokter Sayang (lulusan Universitas Gugel, nilainya pas-pasan) mendeteksi: pasien terlalu kuat, terlalu sibuk, dan terlalu sering lupa kalau dirinya juga butuh dirawat."},
  {t:"📋 Hasil diagnosa", p:"Gejala: senyum yang dipaksa, sok kuat, lupa istirahat, dan lupa makan. Resep: rebahan, air putih, dan baca pesan ini sampai habis."},
  {t:"💊 Aturan pakai", p:"Pesan ini dibaca pelan-pelan, 3 kali sehari sesudah makan. Dilarang di-skip. Kalau di-skip, aku ngambek (sedikit)."},
  {t:"💌 Pesan dari dokter", p:"Sayanggg, hari ini mungkin kamu harus tetap tersenyum, tetap kuat, dan tetap menjalankan banyak hal meskipun sebenarnya tubuh kamu sedang meminta istirahat. Tapi aku harap kamu ga lupa bahwa kamu juga manusia, bukan seseorang yang harus selalu siap sedia dan selalu kuat dalam keadaan apa pun."},
  {t:"💌 Pesan dari dokter", p:"Aku tau ada tanggung jawab yang gabisa begitu saja ditinggalkan, dan aku menghargai itu. Namun, jangan sampai kesibukan merawat dan memperhatikan orang lain membuat kamu lupa merawat diri sendiri. Hari ini, tolong sisakan sedikit perhatian untuk kamu juga, ya."},
  {t:"💌 Pesan dari dokter", p:"Aku mungkin belum bisa berada di samping kamu untuk memastikan kamu baik-baik saja, tapi percayalah, ada seseorang di sini yang selalu berharap kamu sehat, bahagia, dan ga kekurangan alasan untuk tersenyum."},
  {t:"💌 Pesan dari dokter", p:"Aku lebih suka melihat kamu dalam keadaan sehat daripada terus-terusan mengagumi betapa kuatnya kamu saat sedang sakit. Jadi, syafakillah yaa sayang. Jangan lupa, kamu juga seseorang yang ingin aku jaga, bukan hanya seseorang yang ingin aku lihat terus berjuang.", core:true}
];
/* ========================== */

const $=id=>document.getElementById(id);
$('nm').textContent=NAMA_DIA;

/* ---------- AUDIO (semua dibuat lewat Web Audio, tanpa file) ---------- */
let AC,master;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d=.25,type='triangle',v=.25,when=0,slideTo=null){
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function noise(d=.2,v=.3,when=0,fFrom=3000,fTo=800,type='bandpass'){
  const a=ac(),t=a.currentTime+when,n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=b;f.type=type;f.frequency.setValueAtTime(fFrom,t);f.frequency.exponentialRampToValueAtTime(fTo,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const N={C4:262,D4:294,E4:330,G4:392,A4:440,C5:523,D5:587,E5:659,G5:784,A5:880,C6:1047};
const sfx={
  horn(){tone(220,.5,'sawtooth',.22,0,180);tone(330,.5,'square',.1,0,270);},
  drum(){tone(150,.25,'sine',.7,0,45);noise(.18,.45,.12,6000,1500,'highpass');tone(150,.25,'sine',.6,.25,45);tone(150,.25,'sine',.6,.37,45);noise(.18,.45,.25,6000,1500,'highpass');},
  piano(){[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>{tone(f,.5,'triangle',.28,i*.11);tone(f*2,.3,'sine',.06,i*.11);});},
  sneeze(){tone(500,.12,'sine',.12,0,700);tone(520,.12,'sine',.12,.18,720);noise(.35,.5,.42,5000,400);tone(900,.3,'sawtooth',.06,.42,200);},
  boing(){tone(180,.5,'sine',.5,0,720);tone(720,.4,'sine',.3,.5,200);},
  fanfare(){[N.C5,N.C5,N.C5,N.G5,N.E5,N.G5,N.C6].forEach((f,i)=>{const t=[0,.12,.24,.36,.6,.72,.9][i];tone(f,.35,'square',.13,t);tone(f/2,.35,'triangle',.18,t);});noise(.6,.25,.9,8000,1000,'highpass');},
  blip(){tone(700+Math.random()*250,.05,'square',.04);},
  pop(){tone(400,.12,'sine',.4,0,900);},
  charge(p){tone(200+p*8,.08,'sawtooth',.06);},
  fail(){tone(500,.35,'sawtooth',.2,0,90);}
};
$('bHorn').onclick=()=>{sfx.horn();shake()};
$('bDrum').onclick=()=>{sfx.drum();shake()};
$('bPiano').onclick=()=>sfx.piano();
$('bSneeze').onclick=()=>{sfx.sneeze();floatEmoji('🤧',3)};
$('bBoing').onclick=()=>{sfx.boing();floatEmoji('🌈',3)};
$('bConf').onclick=()=>{sfx.fanfare();confetti(160)};

/* musik latar: melodi pentatonik santai, ala kotak musik */
let music=null,step=0;
const MEL=[N.C5,0,N.E5,N.G5,N.A5,0,N.G5,N.E5,N.D5,0,N.E5,N.C5,N.A4,N.C5,N.D5,0,
           N.E5,0,N.G5,N.A5,N.C6,0,N.A5,N.G5,N.E5,0,N.D5,N.E5,N.C5,0,0,0];
const BASS=[N.C4,N.C4,N.A4/2,N.A4/2,N.G4/2,N.G4/2,N.E4/2,N.G4/2];
$('bMusic').onclick=e=>{
  ac();
  if(music){clearInterval(music);music=null;e.currentTarget.classList.remove('on');return;}
  e.currentTarget.classList.add('on');
  music=setInterval(()=>{
    const f=MEL[step%MEL.length];if(f)tone(f,.4,'triangle',.09);
    if(step%4===0)tone(BASS[(step/4)%BASS.length],.9,'sine',.12);
    step++;
  },230);
};

/* ---------- EFEK VISUAL ---------- */
const cv=$('cv'),cx=cv.getContext('2d');let parts=[],raf=null;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(n=140,x=innerWidth/2,y=innerHeight/2){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cols=['#ff5c8a','#ffd23f','#1f9d8b','#ffffff','#7c5cff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*10;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:Math.random()*.4-.2,c:cols[i%cols.length],l:120+Math.random()*60});}
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l-->0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.vx*=.99;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
  raf=parts.length?requestAnimationFrame(loop):null;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake')}
function floatEmoji(e,n=6){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='float';s.textContent=e;
  s.style.left=(5+Math.random()*88)+'vw';s.style.top=(70+Math.random()*25)+'vh';s.style.animationDelay=(i*.12)+'s';
  document.body.appendChild(s);setTimeout(()=>s.remove(),3200);}}

/* ---------- TOMBOL KAPSUL: tahan sampai 100% ---------- */
const cap=$('capWrap');let hold=null,prog=0,opened=false;
function startHold(e){
  if(opened)return;e.preventDefault();ac();
  $('hint').textContent='Terus tahan... jangan dilepas! 😤';
  clearInterval(hold);
  hold=setInterval(()=>{
    prog+=2.2;$('fill').style.height=Math.min(prog,100)+'%';$('pct').textContent=Math.min(100,Math.round(prog))+'%';
    cap.style.transform=`translate(${(Math.random()-.5)*prog/12}px,${(Math.random()-.5)*prog/12}px)`;
    if(Math.round(prog)%6===0)sfx.charge(prog);
    if(prog>=100){clearInterval(hold);openCap();}
  },30);
}
function endHold(){
  if(opened||!hold)return;clearInterval(hold);hold=null;
  if(prog>0&&prog<100){sfx.fail();$('hint').textContent='Yah, kurang sabar! Coba lagi, tahan sampai 100% 🙈';}
  prog=0;$('fill').style.height='0';$('pct').textContent='💊';cap.style.transform='';
}
cap.addEventListener('pointerdown',startHold);
['pointerup','pointerleave','pointercancel'].forEach(ev=>cap.addEventListener(ev,endHold));
cap.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)startHold(e)});
cap.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')endHold()});

function openCap(){
  opened=true;cap.style.transform='';cap.classList.add('open');
  $('pct').textContent='🎉 TERBUKA!';$('hint').textContent='';
  sfx.fanfare();shake();
  const r=cap.getBoundingClientRect();confetti(200,r.left+r.width/2,r.top+r.height/2);
  setTimeout(()=>show(0),1500);
}

/* ---------- KARTU ---------- */
let idx=0,typing=null;
function show(i){
  idx=i;const c=CARDS[i];
  $('s0').classList.remove('on');$('s1').classList.add('on');
  const card=$('card');card.className='card'+(c.core?' core':'');
  card.style.animation='none';void card.offsetWidth;card.style.animation='';
  $('ct').textContent=c.t;sfx.pop();
  const p=$('cp');p.textContent='';clearInterval(typing);let k=0;
  typing=setInterval(()=>{
    p.textContent=c.p.slice(0,++k);if(k%3===0)sfx.blip();
    if(k>=c.p.length){clearInterval(typing);finishCard(c,p);}
  },22);
  $('dots').textContent=(i+1)+' / '+CARDS.length;
  $('next').textContent=i===CARDS.length-1?'Selesai':'Lanjut';
  $('next').style.display='inline-block';
  if(i===3)sfx.piano();
}
function finishCard(c,p){
  if(c.core){
    const s=document.createElement('div');s.className='sign';
    s.innerHTML='I love you, sayang. 💖'+(NAMA_KAMU?'<div style="font:600 15px Nunito;color:#12383a;margin-top:6px">— '+NAMA_KAMU+'</div>':'');
    p.appendChild(s);sfx.fanfare();confetti(240);floatEmoji('💖',10);
    $('next').textContent='Baca lagi 🔁';
  }
}
$('next').onclick=()=>{
  ac();clearInterval(typing);
  if(idx<CARDS.length-1)show(idx+1);
  else{prog=0;$('fill').style.height='0';cap.classList.remove('open');opened=false;
    $('s1').classList.remove('on');$('s0').classList.add('on');$('pct').textContent='💊';$('hint').textContent='Tahan kapsulnya lagi kalau mau baca ulang!';}
};
</script>
</body>
</html>
